<div class="iv">

        <p class="iv-lede">
            <strong>Worldwide, in 25 languages.</strong>
            The invaded here are always non-human: wild animals, plants, fungi and the systems they make.
        </p>
    </header>

        <div class="iv-bar">
            <p class="iv-status" id="ivStatus">Loading the wire…</p>
            <div class="iv-tools">
                <input class="iv-search" id="ivSearch" type="search" placeholder="fire ants, concession, ballast, uncontacted…" aria-label="Filter headlines">
                <button class="iv-btn" id="ivClear">Clear</button>
                <button class="iv-btn" id="ivRefresh">Refresh</button>
            </div>
        </div>
        <div class="iv-progress"><div class="iv-progress-fill" id="ivProgress"></div></div>

        <div class="iv-filters">
            <div class="iv-row" id="ivTopicRow"><span class="iv-key">Subject</span></div>
            <div class="iv-row" id="ivGeoRow"><span class="iv-key">Region</span></div>
            <div class="iv-row" id="ivRegionRow"><span class="iv-key">Standing</span></div>
            <div class="iv-row" id="ivKindRow"><span class="iv-key">Invasion</span></div>
            <div class="iv-row" id="ivEvidenceRow"><span class="iv-key">Evidence</span></div>
            <div class="iv-row" id="ivLangRow"><span class="iv-key">Language</span></div>
            <div class="iv-row" id="ivWhenRow"><span class="iv-key">Window</span></div>
        </div>

        <div class="iv-list" id="ivList"><div class="iv-state">Loading the wire…</div></div>
    </section>

    <div class="iv-sheet" id="ivSheetAbout" role="dialog" aria-label="How this feed works">
        <button class="iv-sheet-close" data-close aria-label="Close">×</button>
        <p class="iv-note">
            <strong>What this is.</strong> A feed on invasion of the non-human world, in both directions it
            happens. The invaded are always non-human — wild animals, plants, fungi and the systems they make.
            <em>Native</em> in this feed never means people; it means the species that were already there.
            Nothing here is written or summarised: headlines and snippets are the publishers' own, every row
            links to the original, and no model touches the text.
        </p>
        <p class="iv-note">
            <strong>Human incursion.</strong> Roads cut into forest, concessions granted over habitat, mining and
            drilling at the frontier, trawling and seabed licensing, tourism and expeditions into places that were
            remote, unsurveyed or left alone. A road on its own is not this feed's business; a road into a forest
            is, which is why both halves have to be present before a story is kept.
        </p>
        <p class="iv-note">
            <strong>Species invasion.</strong> Organisms arriving where they did not evolve, carried in ballast
            water, hull fouling, the pet and horticulture trades, aquaculture escapes and timber; the pathogens
            that travel with them — chytrid, white-nose, high-path avian influenza in wild birds, African swine
            fever in boar; the ranges shifting as waters warm; the wildlife and plants that give way; and the
            eradication and biosecurity work aimed at all of it.
        </p>
        <p class="iv-note">
            <strong>Which is which.</strong> Every row is labelled, and the <em>Invasion</em> filter separates
            them. A story can be both — a new road that also carries a weed front up it — and then it appears
            under both.
        </p>
        <p class="iv-note">
            <strong>Evidence.</strong> Each story is scored on what it carries: a documented incursion — a first
            detection, a concession granted, an outbreak, construction begun (2); institutional material — IUCN,
            IPBES, CBD, a national inventory, satellite monitoring, peer review (2); a measured extent in hectares,
            kilometres or per cent (1); a forward projection (1); a named place (1); and a primary source (1).
            The pips on each row show the score out of five and the words beside them name what earned it. At
            three or more a story counts as well documented, and the <em>Evidence</em> filter narrows the list to
            those — it hides nothing permanently, it just sets aside the passing mentions.
        </p>
        <p class="iv-note">
            <strong>What is refused.</strong> Invasion in its military and criminal senses — armies, home
            invasions, pitch invasions, the film — and <em>alien</em> in its immigration and cinema senses.
            Eradication in its public-health sense, so that polio and malaria campaigns stay out. The status line
            reports how many stories each harvest refused.
        </p>
        <p class="iv-note">
            <strong>Limits worth knowing.</strong> The gate is mechanical: it reads words, not meaning. An
            incursion story written without any habitat vocabulary will be missed. Standing is assigned per wire
            rather than per article. Google News caps a query at roughly 100 results over about 30 days. Coverage
            is uneven by language and the counts show it rather than hiding it.
        </p>
    </div>

    <div class="iv-sheet" id="ivSheetSources" role="dialog" aria-label="Sources and coverage">
        <button class="iv-sheet-close" data-close aria-label="Close">×</button>
        <p class="iv-note">
            Every wire read on the last harvest, with its standing: what it returned, and how many of its
            stories were refused. A wire that could not be reached says so rather than disappearing.
        </p>
        <div class="iv-src-grid" id="ivSrcGrid"></div>
    </div>

    <footer class="iv-foot">
        <span>Harvested every two hours from conservation and biosecurity agencies, journals, field press, regional editions in 25 languages, and dedicated event searches. Headlines belong to their publishers.</span>
        <span class="iv-foot-tools">
            <button class="iv-tab" data-sheet="ivSheetAbout">How this works</button>
            <button class="iv-tab" data-sheet="ivSheetSources">Sources &amp; coverage</button>
        </span>
    </footer>

<script>
(function () {
'use strict';

const REPO = 'WelcomeToYourGalaxy/invasion-feed';
const BRANCH = 'main';
const ENDPOINTS = [
    () => 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/wire_invasion.json?t=' + Date.now(),
    () => 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + BRANCH + '/wire_invasion.json'
];

const TOPIC_COLOR = {
    frontier: '#e0607f',       // rose
    remote: '#9fb8ff',         // indigo
    invasive: '#86e08f',       // green
    pathogens: '#cf6fd8',      // magenta
    pathways: '#6fd3ff',       // cyan
    displacement: '#e29ad8',   // pink
    control: '#8de6c8',        // mint
    law: '#6f9bff',            // azure
    climate: '#a98cf0',        // violet
    impact: '#7fd3d8'          // teal
};
const STANDING_COLOR = {
    official: '#9fb8ff', science: '#8de6c8', field: '#86e08f', press: '#9fb0c8'
};
const KIND_COLOR = { human: '#e0607f', species: '#86e08f' };
const WINDOWS = [
    { id: 'd1', label: '24 hours', ms: 864e5 },
    { id: 'd7', label: '7 days', ms: 7 * 864e5 },
    { id: 'd30', label: '30 days', ms: 30 * 864e5 },
    // the wire keeps 45 days, so anything past a month is reachable on its own
    { id: 'older', label: 'Older than 30 days', ms: 30 * 864e5, older: true },
    { id: 'all', label: 'Everything', ms: null }
];

const EVIDENCE = [
    { id: 'all', label: 'All stories' },
    { id: 'doc', label: 'Well-documented only' }
];

const state = { items: [], topics: [], languages: {}, sources: [], generated: null,
                geo: [], standings: [], kinds: [], docScore: 3, topic: 'all', standing: 'all',
                place: 'all', kind: 'all', langs: new Set(), when: 'all', evidence: 'all',
                query: '', shown: 50, loading: false };

const $list = document.getElementById('ivList');
const $status = document.getElementById('ivStatus');
const $dot = document.getElementById('ivDot');
const $prog = document.getElementById('ivProgress');
const $topicRow = document.getElementById('ivTopicRow');
const $standingRow = document.getElementById('ivRegionRow');
const $evidenceRow = document.getElementById('ivEvidenceRow');
const $kindRow = document.getElementById('ivKindRow');
const $geoRow = document.getElementById('ivGeoRow');
const $langRow = document.getElementById('ivLangRow');
const $whenRow = document.getElementById('ivWhenRow');
const $search = document.getElementById('ivSearch');
const $srcGrid = document.getElementById('ivSrcGrid');
const $refresh = document.getElementById('ivRefresh');
const $more = document.createElement('button');
$more.className = 'iv-more';
$more.addEventListener('click', () => { state.shown += 50; render(); });

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function timeAgo(ts) {
    if (!ts) return 'undated';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.round(h / 24);
    return d < 30 ? d + 'd ago' : new Date(ts).toISOString().slice(0, 10);
}
function langName(c) { return state.languages[c] || c; }
function placeLabel(places) {
    const named = places.filter(p => p !== 'unlocated');
    if (!named.length) return 'unplaced';
    return named.map(p => {
        const g = state.geo.find(g => g.id === p);
        return g ? g.label : p;
    }).slice(0, 3).join(' · ');
}
function topicLabel(id) { const t = state.topics.find(t => t.id === id); return t ? t.label : id; }
function setStatus(text, cls) { $status.textContent = text; $dot.className = 'iv-dot' + (cls ? ' ' + cls : ''); }

async function load() {
    if (state.loading) return;
    state.loading = true; $refresh.disabled = true; $prog.style.width = '40%';
    setStatus('Loading the wire…', '');

    let data = null, err = null;
    for (const ep of ENDPOINTS) {
        try {
            const res = await fetch(ep(), { cache: 'no-store' });
            if (!res.ok) { err = 'HTTP ' + res.status; continue; }
            data = await res.json(); break;
        } catch (e) { err = e.message; }
    }
    $prog.style.width = '100%';

    if (!data || !Array.isArray(data.items)) {
        state.loading = false; $refresh.disabled = false; $prog.style.width = '0';
        setStatus('The wire could not be read' + (err ? ' (' + err + ')' : '') + '. Press Refresh.', 'error');
        render(); return;
    }

    state.items = data.items.map(i => ({
        title: i.t, link: i.u, outlet: i.o, lang: i.g, region: i.r,
        kind: i.k, ts: i.d, snippet: i.s, topics: i.x || ['climate'],
        score: i.p || 0, why: i.y || [], places: i.w || ['unlocated'],
        standing: i.st || 'press', kinds: i.k || ['species']
    }));
    state.docScore = data.notable_score || 3;
    state.standings = data.standings || [];
    state.kindList = data.kinds || [];
    state.topics = data.topics || [];
    state.languages = data.languages || {};
    state.geo = data.geo || [];
    state.sources = data.sources || [];
    state.generated = data.generated ? Date.parse(data.generated) : null;

    buildChips(); renderSources();

    const c = data.counts || {};
    const ageH = state.generated ? (Date.now() - state.generated) / 3600000 : null;
    const docd = state.items.filter(i => i.score >= state.docScore).length;
    setStatus(
        (c.stories || state.items.length) + ' stories · ' + docd + ' well-documented · ' +
        (c.refused ? c.refused + ' refused · ' : '') +
        (c.languages || new Set(state.items.map(i => i.lang)).size) + ' languages · ' +
        (c.wires_ok || '?') + '/' + (c.wires_total || '?') + ' wires answered · harvested ' +
        (state.generated ? timeAgo(state.generated) : 'unknown'),
        ageH !== null && ageH > 6 ? 'idle' : ''
    );

    state.loading = false; $refresh.disabled = false;
    setTimeout(() => { $prog.style.width = '0'; }, 400);
    render();
}

function withinWindow(i, win) {
    const w = WINDOWS.find(w => w.id === (win || state.when));
    if (!w || !w.ms) return true;
    if (!i.ts) return false;
    const age = Date.now() - i.ts;
    return w.older ? age > w.ms : age <= w.ms;
}

function visible() {
    const q = state.query.toLowerCase();
    return state.items.filter(i => {
        if (state.topic !== 'all' && i.topics.indexOf(state.topic) === -1) return false;
        if (state.standing !== 'all' && i.standing !== state.standing) return false;
        if (state.kind !== 'all' && i.kinds.indexOf(state.kind) === -1) return false;
        if (state.evidence === 'doc' && i.score < state.docScore) return false;
        if (state.place !== 'all' && i.places.indexOf(state.place) === -1) return false;
        if (state.langs.size && !state.langs.has(i.lang)) return false;
        if (!withinWindow(i)) return false;
        if (q && (i.title + ' ' + i.snippet + ' ' + i.outlet).toLowerCase().indexOf(q) === -1) return false;
        return true;
    }).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

function render() {
    const items = visible(), slice = items.slice(0, state.shown);
    if (!slice.length) {
        $list.innerHTML = '<div class="iv-state">' + (
            state.loading ? 'Loading the wire…'
            : state.items.length ? '<strong>Nothing matches these filters.</strong><br>Widen the window, the subject or the language.'
            : '<strong>No stories loaded.</strong><br>Press Refresh, or check that the harvester has run.'
        ) + '</div>';
    } else {
        $list.innerHTML = slice.map(i => {
            const tags = i.topics.map(id => {
                const c = TOPIC_COLOR[id] || '#9fb0c8';
                return '<span class="iv-t" style="color:' + c + ';border-color:' + c + '55">' + esc(topicLabel(id)) + '</span>';
            }).join('');
            const documented = i.score >= state.docScore;
            const sc = STANDING_COLOR[i.standing] || '#9fb0c8';
            const stLabel = (state.standings.find(s => s.id === i.standing) || {}).label || i.standing;
            const pips = '<span class="iv-scale" title="evidence score ' + i.score + '">' +
                [1,2,3,4,5].map(n => '<span class="iv-pip' + (n <= Math.min(i.score,5) ? ' on' : '') + '"></span>').join('') +
                '</span>';
            return '<a class="iv-item' + (documented ? ' watch' : '') + '" href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer">' +
                '<div class="iv-meta"><span class="iv-lang">' + esc(langName(i.lang)) + '</span>' +
                '<span class="iv-standing" style="color:' + sc + ';border-color:' + sc + '55">' + esc(stLabel) + '</span>' +
                i.kinds.map(k => {
                    const kc = KIND_COLOR[k] || '#9fb0c8';
                    const kl = (state.kindList.find(x => x.id === k) || {}).label || k;
                    return '<span class="iv-standing" style="color:' + kc + ';border-color:' + kc + '55">' + esc(kl) + '</span>';
                }).join('') +
                '<span>' + esc(i.outlet) + '</span>' +
                '<span>' + esc(placeLabel(i.places)) + '</span>' +
                pips + (i.why.length ? '<span class="iv-why">' + esc(i.why.join(' · ')) + '</span>' : '') +
                '<span>' + timeAgo(i.ts) + '</span></div>' +
                '<div class="iv-item-title">' + esc(i.title) + '</div>' +
                (i.snippet ? '<div class="iv-snip">' + esc(i.snippet) + '</div>' : '') +
                '<div class="iv-tags">' + tags + '</div></a>';
        }).join('');
        if (items.length > state.shown) {
            $more.textContent = 'Show more (' + (items.length - state.shown) + ' remaining)';
            $list.appendChild($more);
        } else {
            // the list scrolls inside its own box, so mark where the bottom is
            const end = document.createElement('div');
            end.className = 'iv-state';
            end.style.padding = '0.7rem';
            end.style.fontSize = '0.62rem';
            end.textContent = 'End of ' + items.length + ' ' + (items.length === 1 ? 'story' : 'stories');
            $list.appendChild(end);
        }
    }
    chipCounts();
}

function chip(row, key, value, label, color) {
    const c = document.createElement('button');
    c.className = 'iv-chip';
    c.dataset[key] = value;
    if (color) c.style.setProperty('--chipcolor', color);
    c.innerHTML = esc(label) + ' <span class="iv-n"></span>';
    row.appendChild(c);
    return c;
}

function buildChips() {
    [$topicRow, $geoRow, $standingRow, $kindRow, $evidenceRow, $langRow, $whenRow].forEach(r => r.querySelectorAll('.iv-chip').forEach(c => c.remove()));

    chip($topicRow, 'topic', 'all', 'All').classList.add('on');
    state.topics.forEach(t => chip($topicRow, 'topic', t.id, t.label, TOPIC_COLOR[t.id]));

    chip($geoRow, 'place', 'all', 'Everywhere').classList.add('on');
    state.geo.forEach(g => {
        const c = chip($geoRow, 'place', g.id, g.label);
        if (g.id === state.place) c.classList.add('on');
    });

    chip($standingRow, 'standing', 'all', 'All').classList.add('on');
    state.standings.forEach(st => {
        const c = chip($standingRow, 'standing', st.id, st.label);
        c.style.setProperty('--chipcolor', STANDING_COLOR[st.id] || '#e8eef7');
        if (st.id === state.standing) c.classList.add('on');
    });

    chip($kindRow, 'kind', 'all', 'Both').classList.add('on');
    (state.kindList || []).forEach(k => {
        const c = chip($kindRow, 'kind', k.id, k.label);
        c.style.setProperty('--chipcolor', KIND_COLOR[k.id] || '#e8eef7');
        if (k.id === state.kind) c.classList.add('on');
    });

    EVIDENCE.forEach(e => {
        const c = chip($evidenceRow, 'evidence', e.id, e.label);
        if (e.id === state.evidence) c.classList.add('on');
    });

    Object.keys(state.languages).sort((a, b) => langName(a).localeCompare(langName(b)))
        .forEach(code => chip($langRow, 'lang', code, langName(code)));

    WINDOWS.forEach(w => {
        const c = chip($whenRow, 'when', w.id, w.label);
        if (w.id === state.when) c.classList.add('on');
    });

}

function chipCounts() {
    const q = state.query.toLowerCase();
    const base = state.items.filter(i =>
        (!q || (i.title + ' ' + i.snippet).toLowerCase().indexOf(q) !== -1) && withinWindow(i));
    $topicRow.querySelectorAll('.iv-chip').forEach(c => {
        const id = c.dataset.topic;
        const n = id === 'all' ? base.length : base.filter(i => i.topics.indexOf(id) !== -1).length;
        c.querySelector('.iv-n').textContent = n;
        c.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $geoRow.querySelectorAll('.iv-chip').forEach(c => {
        const g = c.dataset.place;
        const n = g === 'all' ? base.length : base.filter(i => i.places.indexOf(g) !== -1).length;
        c.querySelector('.iv-n').textContent = n;
        c.classList.toggle('empty', n === 0 && g !== 'all');
    });
    $standingRow.querySelectorAll('.iv-chip').forEach(c => {
        const r = c.dataset.standing;
        const n = r === 'all' ? base.length : base.filter(i => i.standing === r).length;
        c.querySelector('.iv-n').textContent = n;
        c.classList.toggle('empty', n === 0 && r !== 'all');
    });
    $kindRow.querySelectorAll('.iv-chip').forEach(c => {
        const k = c.dataset.kind;
        const n = k === 'all' ? base.length : base.filter(i => i.kinds.indexOf(k) !== -1).length;
        c.querySelector('.iv-n').textContent = n;
        c.classList.toggle('empty', n === 0 && k !== 'all');
    });
    $evidenceRow.querySelectorAll('.iv-chip').forEach(c => {
        const id = c.dataset.evidence;
        c.querySelector('.iv-n').textContent =
            id === 'doc' ? base.filter(i => i.score >= state.docScore).length : base.length;
    });
    $langRow.querySelectorAll('.iv-chip').forEach(c => {
        const n = base.filter(i => i.lang === c.dataset.lang).length;
        c.querySelector('.iv-n').textContent = n;
        c.classList.toggle('empty', n === 0);
    });
    $whenRow.querySelectorAll('.iv-chip').forEach(c => {
        const n = state.items.filter(i => withinWindow(i, c.dataset.when)).length;
        c.querySelector('.iv-n').textContent = n;
        // the archive chip only appears once there is an archive
        if (c.dataset.when === 'older') c.style.display = n ? '' : 'none';
    });
}

function renderSources() {
    $srcGrid.innerHTML = state.sources.map(s =>
        '<div class="iv-src ' + (s.ok ? '' : 'fail') + '"><span>' + esc(s.name) + '</span>' +
        '<span>' + (s.ok ? s.kept + ' kept' + (s.refused ? ' · ' + s.refused + ' refused' : '') : 'unreachable') +
        '</span></div>').join('');
}

/* ---- Wiring ---- */
function single(row, key) {
    row.addEventListener('click', e => {
        const c = e.target.closest('.iv-chip'); if (!c) return;
        state[key] = c.dataset[key]; state.shown = 50;
        row.querySelectorAll('.iv-chip').forEach(x => x.classList.toggle('on', x === c));
        render();
    });
}
single($topicRow, 'topic');
single($standingRow, 'standing');
single($evidenceRow, 'evidence');
single($kindRow, 'kind');
single($geoRow, 'place');
single($whenRow, 'when');

$langRow.addEventListener('click', e => {
    const c = e.target.closest('.iv-chip'); if (!c) return;
    const code = c.dataset.lang;
    if (state.langs.has(code)) state.langs.delete(code); else state.langs.add(code);
    c.classList.toggle('on', state.langs.has(code));
    state.shown = 50; render();
});

$refresh.addEventListener('click', load);
document.getElementById('ivClear').addEventListener('click', () => {
    state.topic = 'all'; state.standing = 'all'; state.evidence = 'all'; state.place = 'all';
    state.kind = 'all';
    state.langs.clear(); state.when = 'all';
    state.query = ''; state.shown = 50; $search.value = '';
    $topicRow.querySelectorAll('.iv-chip').forEach(c => c.classList.toggle('on', c.dataset.topic === 'all'));
    $standingRow.querySelectorAll('.iv-chip').forEach(c => c.classList.toggle('on', c.dataset.standing === 'all'));
    $evidenceRow.querySelectorAll('.iv-chip').forEach(c => c.classList.toggle('on', c.dataset.evidence === 'all'));
    $kindRow.querySelectorAll('.iv-chip').forEach(c => c.classList.toggle('on', c.dataset.kind === 'all'));
    $geoRow.querySelectorAll('.iv-chip').forEach(c => c.classList.toggle('on', c.dataset.place === 'all'));
    $langRow.querySelectorAll('.iv-chip').forEach(c => c.classList.remove('on'));
    $whenRow.querySelectorAll('.iv-chip').forEach(c => c.classList.toggle('on', c.dataset.when === 'all'));
    render();
});
let timer;
$search.addEventListener('input', e => {
    clearTimeout(timer); const v = e.target.value;
    timer = setTimeout(() => { state.query = v; state.shown = 50; render(); }, 180);
});

document.querySelectorAll('.iv-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        const sheet = document.getElementById(tab.dataset.sheet);
        const opening = !sheet.classList.contains('open');
        document.querySelectorAll('.iv-sheet').forEach(s => s.classList.remove('open'));
        document.querySelectorAll('.iv-tab').forEach(t => t.classList.remove('on'));
        if (opening) { sheet.classList.add('open'); tab.classList.add('on'); }
    });
});
document.querySelectorAll('.iv-sheet [data-close]').forEach(b => {
    b.addEventListener('click', () => {
        b.closest('.iv-sheet').classList.remove('open');
        document.querySelectorAll('.iv-tab').forEach(t => t.classList.remove('on'));
    });
});
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.iv-sheet').forEach(s => s.classList.remove('open'));
    document.querySelectorAll('.iv-tab').forEach(t => t.classList.remove('on'));
});

load();
setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);
})();
